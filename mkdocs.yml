              - workspace_list: reference/clients/async-herdr-client/workspace-list.md
              - tab_list: reference/clients/async-herdr-client/tab-list.md
              - pane_list: reference/clients/async-herdr-client/pane-list.md
              - pane_send_text: reference/clients/async-herdr-client/pane-send-text.md
