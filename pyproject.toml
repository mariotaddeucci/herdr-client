[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "herdr-python-client"
version = "0.2.0"
description = "Sync and async Python clients for the herdr Unix socket API"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Martin Taddeucci" }]
keywords = ["herdr", "terminal", "socket", "async", "client", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[dependency-groups]
dev = [
  "pyrefly>=0.18.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "pre-commit>=4.0",
  "ruff>=0.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/herdr_client"]

[tool.pytest.ini_options]
addopts = [
  "--strict-markers",
  "--cov=herdr_client",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: tests that require an explicitly configured live Herdr socket",
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "DTZ",
  "E",
  "F",
  "FA",
  "I",
  "ICN",
  "ISC",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PT",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "UP",
]

[tool.ruff.lint.per-file-ignores]
# ``format`` is part of the public protocol API and must remain a keyword.
"src/herdr_client/async_client/client.py" = ["A002"]
"src/herdr_client/interfaces.py" = ["A002"]
"src/herdr_client/sync/client.py" = ["A002"]
# Keep the existing import-compatible helper name.
"src/herdr_client/transport.py" = ["N802"]
# Assertions are the native failure mechanism in pytest tests.
"tests/**/*.py" = ["S101"]
# Integration fixtures invoke fixed git commands and do not handle user input.
"tests/integration/**/*.py" = ["S603", "S607"]
# Membership assertions are clearer in their natural pytest form.
"tests/test_protocol.py" = ["SIM300"]

[tool.ruff.format]
quote-style = "double"

[tool.pyrefly]
preset = "all"
project-includes = ["src/**/*.py", "src/**/*.pyi", "tests/typecheck_contracts.py"]
search-path = ["src"]
python-version = "3.13"
check-unannotated-defs = true
strict-callable-subtyping = true
strict-partial-subtyping = true
spec-compliant-overloads = true
treat-all-caps-as-final = true
